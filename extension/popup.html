<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body {
      width: 300px; margin: 0; padding: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #ffffff; color: #1f2430;
    }
    .head {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px 12px; border-bottom: 1px solid #eef1f5;
    }
    .head img { width: 34px; height: 34px; border-radius: 8px; }
    .head .t { font-size: 14px; font-weight: 600; }
    .head .s { font-size: 11px; color: #8b93a2; margin-top: 2px; }

    .body { padding: 14px 16px 16px; }

    #url {
      font-size: 11px; color: #5b6472; word-break: break-all;
      background: #f5f7fa; border-radius: 8px; padding: 8px 10px;
      max-height: 54px; overflow: auto; line-height: 1.5;
    }

    .primary {
      width: 100%; margin-top: 12px; padding: 11px;
      border: none; border-radius: 9px;
      background: linear-gradient(135deg, #2563EB 0%, #22D3EE 100%);
      color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .primary:hover { filter: brightness(1.06); }
    .primary:disabled { background: #b9c0cc; cursor: default; filter: none; }

    #status { margin-top: 9px; font-size: 12px; min-height: 16px; color: #4b5563; }

    .sec {
      margin-top: 16px; padding-top: 14px; border-top: 1px solid #eef1f5;
    }
    .sec-t { font-size: 11px; color: #9aa3b2; font-weight: 600;
             letter-spacing: .3px; margin-bottom: 10px; }

    .row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 0;
    }
    .row .lab { font-size: 13px; color: #2b3342; }
    .row .desc { font-size: 11px; color: #9aa3b2; margin-top: 2px; }

    /* 开关 */
    .sw { position: relative; width: 42px; height: 24px; flex: none; }
    .sw input { opacity: 0; width: 0; height: 0; position: absolute; }
    .sw .track {
      position: absolute; inset: 0; border-radius: 99px;
      background: #cfd6e0; transition: background .22s ease; cursor: pointer;
    }
    .sw .knob {
      position: absolute; top: 3px; left: 3px; width: 18px; height: 18px;
      border-radius: 50%; background: #fff;
      box-shadow: 0 1px 3px rgba(0,0,0,.25);
      transition: transform .22s cubic-bezier(.4,0,.2,1);
      pointer-events: none;
    }
    .sw input:checked ~ .track { background: linear-gradient(135deg,#2563EB,#22D3EE); }
    .sw input:checked ~ .knob { transform: translateX(18px); }
  </style>
</head>
<body>
  <div class="head">
    <img id="logo" src="icon128.png" alt="">
    <div>
      <div class="t">音频转文字</div>
      <div class="s">视频 → 文字笔记</div>
    </div>
  </div>

  <div class="body">
    <div id="url">获取中…</div>
    <button id="go" class="primary">转换当前页面</button>
    <div id="status"></div>

    <div class="sec">
      <div class="sec-t">显示设置</div>
      <div class="row">
        <div>
          <div class="lab">页面悬浮按钮</div>
          <div class="desc">视频页显示可点击的浮标</div>
        </div>
        <label class="sw">
          <input type="checkbox" id="swFloat" checked>
          <span class="track"></span>
          <span class="knob"></span>
        </label>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
